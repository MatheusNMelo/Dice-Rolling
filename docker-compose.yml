version: '3.8'

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./start-server.sh
    working_dir: /app/server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
